<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>PA#1</title>
    <style>
        body {
            background-color: #EEEEEE;
        }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./model.js"></script>
    <script src="./main.js"></script>

</head>

<body onload="init()">

    <h2>A with "Trackball" Mouse Rotation</h2>

    <p id="message">Drag your mouse on the cube to rotate it.<br>
        (On a touch screen, you can use your finger.)</p>
    <div id="sliders" style="margin-bottom: 10px;">
        <label for="uSteps">U Granularity:</label>
        <input type="range" id="uSteps" min="4" max="100" value="36" oninput="updateSurface()">
        <span id="uStepsValue">36</span>
        <br>
        <label for="vSteps">V Granularity:</label>
        <input type="range" id="vSteps" min="4" max="100" value="20" oninput="updateSurface()">
        <span id="vStepsValue">20</span>
    </div>
    <div id="canvas-holder">
        <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
    </div>


</body>

</html>
