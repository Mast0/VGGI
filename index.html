<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebGL Surface</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #eee;
            font-family: sans-serif;
            font-size: 14px;
        }

        #webglcanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: #2b2b2b;
            padding: 8px 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .controls label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls input[type="range"] {
            cursor: pointer;
        }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./model.js"></script>
    <script src="./main.js"></script>
</head>

<body onload="init()">

    <div class="controls">
        <label>
            U:
            <input type="range" id="uSteps" min="4" max="100" value="36" oninput="updateSurface()">
            <span id="uStepsValue">36</span>
        </label>
        <label>
            V:
            <input type="range" id="vSteps" min="4" max="100" value="20" oninput="updateSurface()">
            <span id="vStepsValue">20</span>
        </label>
    </div>

    <div id="canvas-holder">
        <canvas id="webglcanvas"></canvas>
    </div>

</body>

</html>
